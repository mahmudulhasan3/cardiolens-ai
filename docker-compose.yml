services:
  api:
    build: .
    image: cardiolens-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      # Ask the API itself if it is ready, from inside the container
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - feedback_data:/code/outputs

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: cardiolens-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
volumes:
  feedback_data: